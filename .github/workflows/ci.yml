name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /vera-rubin-nvl72-explorer/
      - name: Check that no image files are committed or bundled
        run: |
          pattern='\.(png|jpe?g|webp|gif|svg|ico|avif|bmp|tiff?)$'
          found="$( { git ls-files; find dist -type f; } | grep -Ei "$pattern" || true)"
          if [ -n "$found" ]; then
            echo "$found" >&2
            echo "Image files found; NVIDIA figures must only be hot-linked." >&2
            exit 1
          fi
